<h3>{{eventName()}}</h3>
<div>
    <p> Quantidade: {{ tickets()}}</p>
    <button type="button" (click)="increaseTicketCount()">+</button>
    <button type="button" (click)="decreaseTicketCount()">-</button>

    <input id="couponId" (keyup.enter)="onCouponInput($event)">

    <button type="button" (click)="cancelTicket()">Cancelar</button>
</div>
